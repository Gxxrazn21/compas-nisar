<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Compás, video</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="stage">
      <!-- Apertura y concepto: el pentagrama grande -->
      <section id="intro" class="scene">
        <h1 id="wordmark">compás</h1>
        <p id="tagline"></p>
        <div id="concept">
          <h2 id="concept-h"></h2>
          <p id="concept-p"></p>
        </div>
        <svg id="staff" viewBox="0 0 1920 1080" aria-hidden="true"></svg>
      </section>

      <!-- La aplicación en uso -->
      <section id="app" class="scene">
        <div id="window">
          <div id="cam">
            <img id="shot-a" alt="" />
            <img id="shot-b" alt="" />
            <div id="mark"></div>
          </div>
        </div>
        <div id="caption">
          <p id="kicker"></p>
          <p id="headline"></p>
        </div>
      </section>

      <!-- Las cuatro historias -->
      <section id="montage" class="scene">
        <h2 id="montage-h"></h2>
        <div id="cards"></div>
      </section>

      <!-- Evidencia antes que conclusiones -->
      <section id="honesty" class="scene">
        <div id="honesty-text">
          <h2 id="honesty-h"></h2>
          <ul id="honesty-list"></ul>
        </div>
        <div id="honesty-window"><img id="honesty-img" alt="" /></div>
      </section>

      <!-- Cierre -->
      <section id="outro" class="scene">
        <p id="outro-mark">compás</p>
        <svg id="outro-staff" viewBox="0 0 1920 120" aria-hidden="true"></svg>
        <p id="outro-a"></p>
        <p id="outro-b"></p>
        <p id="outro-c">github.com/Gxxrazn21/compas-nisar</p>
      </section>

      <!-- La línea de tiempo del propio video, como partitura -->
      <svg id="progress" viewBox="0 0 1920 70" aria-hidden="true"></svg>
    </div>
    <script src="script.js"></script>
    <script src="timeline.js"></script>
  </body>
</html>
